services:
  - type: web
    name: robloxsc-proxy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --worker-class gthread --threads 16 --timeout 900 --bind 0.0.0.0:$PORT
    envVars:
      - key: ALLOWED_HOSTS
        value: tooken.club,anymodel.org
      - key: PROXY_TOKEN
        generateValue: true
      - key: GITHUB_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
